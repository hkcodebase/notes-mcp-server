services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: notes-api
    environment:
      NOTES_DIR: /notes
      CHROMA_DIR: /chroma_db
      LLM_BASE_URL: http://model-runner.docker.internal/engines/llama.cpp/v1
      LLM_MODEL: ${LLM_MODEL:-ai/gemma4}
      EMBEDDING_MODEL: all-MiniLM-L6-v2
    volumes:
      - ./api:/app
      - ${NOTES_DIR:-./notes}:/notes:ro
      - chroma_data:/chroma_db
    ports:
      - "8000:8000"
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: notes-ui
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  chroma_data:
